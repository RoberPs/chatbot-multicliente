# Despliegue de produccion: un VPS, dos instancias, PostgreSQL por socket Unix.
# Acompaña a la receta de docs/operacion-multicliente.md (seccion 2.5); cada decision de aqui
# tiene su comprobacion alli. Se arranca con:
#
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# La imagen NO se construye aqui: se construye aparte, siempre etiquetada con su version
# (chatbot:X.Y.Z, nunca `latest`) y se referencia con las variables CHATBOT_IMAGEN (el nombre,
# `chatbot` en local y `ghcr.io/<usuario>/<paquete>` en produccion) y CHATBOT_VERSION.
#
# Las dos se leen del fichero `.env` que vive JUNTO A ESTE FICHERO (compose lo carga solo, por
# ser el directorio del proyecto). Tiene que ser un fichero y no variables exportadas: las
# ordenes de Docker van con `sudo`, y `sudo` limpia el entorno del llamante, asi que un
# `export CHATBOT_VERSION=...` se pierde y el compose aborta por el `:?` de abajo.
#
# Los ficheros de entorno viven FUERA del repositorio, con dueño `operador` y modo 0600
# (receta, paso 2). Este fichero no contiene ningun secreto.

name: chatbot

x-instancia-comun: &instancia-comun
  image: ${CHATBOT_IMAGEN:-chatbot}:${CHATBOT_VERSION:?define CHATBOT_VERSION, p. ej. 0.1.0}
  restart: unless-stopped
  # Contenedor endurecido (receta, paso 5): raiz de solo lectura, /tmp en memoria, sin
  # capacidades y sin escalada de privilegios.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # Sin `ports`: la instancia no publica ningun puerto. Solo Caddy la alcanza, por la red
  # interna de Docker. Es la segunda via que admite el paso 6 de la receta («o en una red
  # interna de Docker sin -p»), y deja el VPS sin puertos de aplicacion escuchando.
  networks:
    - proxy
  depends_on:
    db:
      condition: service_healthy
    db-verificacion:
      condition: service_healthy

services:
  # --- PostgreSQL de produccion ------------------------------------------------------------
  db:
    image: postgres:16
    restart: unless-stopped
    # Sin TCP: `listen_addresses` vacio deja solo el socket Unix. La base de datos no es
    # alcanzable por red ni desde dentro de Docker; las instancias entran por el socket del
    # volumen `pg-socket`, que el nucleo clasifica como local (src/config/database-url.ts).
    command: ['postgres', '-c', 'listen_addresses=']
    # IMPRESCINDIBLE y solo efectivo en el PRIMER arranque, cuando se crea el cluster: sin
    # esto, initdb escribe `local all all trust` en pg_hba.conf y cualquier contenedor que
    # monte el socket entraria como superusuario SIN contraseña, saltandose el aislamiento
    # entre instancias (seccion 3 de la guia). Si el volumen ya existe, no se aplica: hay que
    # corregir pg_hba.conf a mano y recargar la configuracion.
    environment:
      POSTGRES_INITDB_ARGS: '--auth-local=scram-sha-256 --auth-host=scram-sha-256'
    env_file:
      # `format: raw` (Compose >= 2.30): SIN el, Compose interpola los `$...` del VALOR como si
      # fueran variables suyas y los sustituye por cadena vacia. Lo rompe todo en el hash
      # Argon2id de OPERATOR_PASSWORD_HASH, que es `$argon2id$v=19$m=...$sal$digest`: llega a la
      # instancia destrozado, Zod lo rechaza (src/config/env.ts:46) y el contenedor queda
      # unhealthy. Se pone en los cinco env_file, no solo en los de instancia, porque cualquier
      # contraseña futura puede llevar un `$`.
      #
      # A cambio, `raw` tampoco quita las comillas: los valores van SIN comillas en el fichero.
      - path: /srv/chatbot/db.env    # POSTGRES_PASSWORD (superusuario), 0600
        format: raw
    volumes:
      - db-datos:/var/lib/postgresql/data
      - pg-socket:/var/run/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -q']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- PostgreSQL de verificacion de copias (receta, paso 8) -------------------------------
  # Separado del de produccion y con un unico rol `verificador` (CREATEDB) que NO tiene acceso
  # a las bases de las instancias, porque viven en otro cluster.
  db-verificacion:
    image: postgres:16
    restart: unless-stopped
    command: ['postgres', '-c', 'listen_addresses=']
    environment:
      POSTGRES_INITDB_ARGS: '--auth-local=scram-sha-256 --auth-host=scram-sha-256'
    env_file:
      - path: /srv/chatbot/db-verificacion.env
        format: raw
    volumes:
      - db-verificacion-datos:/var/lib/postgresql/data
      - pg-socket-verificacion:/var/run/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -q']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Instancia 1 -------------------------------------------------------------------------
  instancia-1:
    <<: *instancia-comun
    container_name: instancia-1
    env_file:
      - path: /srv/chatbot/instancia-1.env
        format: raw
    volumes:
      # Los sockets NO se montan en solo lectura: conectar a un socket Unix exige permiso de
      # escritura sobre su inodo.
      - pg-socket:/var/run/postgresql
      - pg-socket-verificacion:/var/run/postgresql-verificacion
      # Copias: montaje del host creado con dueño UID 1000 y modo 0700 (receta, paso 3):
      #   install -d -o 1000 -g 1000 -m 700 /srv/chatbot/instancia-1/backups
      - /srv/chatbot/instancia-1/backups:/var/lib/chatbot/backups

  # --- Instancia 2 -------------------------------------------------------------------------
  instancia-2:
    <<: *instancia-comun
    container_name: instancia-2
    env_file:
      - path: /srv/chatbot/instancia-2.env
        format: raw
    volumes:
      - pg-socket:/var/run/postgresql
      - pg-socket-verificacion:/var/run/postgresql-verificacion
      - /srv/chatbot/instancia-2/backups:/var/lib/chatbot/backups

  # --- Proxy inverso -----------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop:
      - ALL
    # Caddy necesita NET_BIND_SERVICE para escuchar en los puertos 80 y 443.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: /srv/chatbot/caddy.env # ACME_CORREO, INSTANCIA_1_DOMINIO, INSTANCIA_2_DOMINIO
        format: raw
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data            # certificados de Let's Encrypt: no perderlos entre reinicios
      - caddy-config:/config
    networks:
      - proxy
    depends_on:
      - instancia-1
      - instancia-2

networks:
  proxy:
    driver: bridge

volumes:
  db-datos:
  db-verificacion-datos:
  pg-socket:
  pg-socket-verificacion:
  caddy-datos:
  caddy-config:
